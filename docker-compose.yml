services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clincode
      POSTGRES_PASSWORD: clincode
      POSTGRES_DB: clincode
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://clincode:clincode@db:5432/clincode
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
