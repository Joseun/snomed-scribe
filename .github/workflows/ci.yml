name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clincode
          POSTGRES_PASSWORD: clincode
          POSTGRES_DB: clincode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: make install

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://clincode:clincode@localhost:5432/clincode_test
        run: make test

  build-images:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t clincode-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t clincode-frontend:${{ github.sha }} ./frontend
